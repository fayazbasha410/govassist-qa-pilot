name: Full Test Suite (develop → staging)

on:
  pull_request:
    branches: [ staging ]

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  # ── Job 1: Full Playwright suite — 200 tests ──────────
  full-playwright:
    name: Full Playwright Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready! ✅" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done

      - name: Run full Playwright suite
        run: npx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Job 2: RAG regression gate ────────────────────────
  regression-gate:
    name: RAG Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: full-playwright

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm install -g promptfoo

      - name: Start server
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && break
            sleep 3
          done

      - name: Run regression gate
        run: npm run eval:regression

  # ── Job 3: Red team ───────────────────────────────────
  red-team:
    name: Adversarial Red Team
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: full-playwright

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Start server
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && break
            sleep 3
          done

      - name: Run red team
        run: npm run eval:redteam