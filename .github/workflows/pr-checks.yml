name: PR Checks (feature → develop)




on:
  pull_request:
    branches: [ develop ]




env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}




jobs:
  # ── Job 1: Unit tests (Vitest) — fastest job, no server, runs in parallel ──
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5




    steps:
      - uses: actions/checkout@v4




      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'




      - run: npm ci




      - name: Run Vitest unit suite
        run: npm run test:unit




  # ── Job 2: Schema validation (no server needed, free) ──
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5




    steps:
      - uses: actions/checkout@v4




      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'




      - run: npm ci




      - name: Validate policy data
        run: |
          node -e "
          const p = require('./src/data/policies');
          console.log('Total policies:', p.length);
          if (p.length < 35) { console.error('Missing policies!'); process.exit(1); }
          for (const pol of p) {
            if (!pol.id || !pol.title || !pol.content) {
              console.error('Invalid policy:', pol.id);
              process.exit(1);
            }
          }
          console.log('All policies valid ✅');
          "




      - name: Validate test data
        run: |
          node -e "
          const td = require('./tests/data/testData');
          const required = ['APPOINTMENTS', 'GUARDRAIL_INPUTS', 'CHAT_MESSAGES'];
          for (const key of required) {
            if (!td[key]) { console.error('Missing:', key); process.exit(1); }
          }
          console.log('Test data valid ✅');
          "




  # ── Job 3: Boot smoke — does the app even start? ZERO Groq cost. ──
  # Deliberately does not hit /api/chat (that's the only route that calls
  # the LLM). /api/health and /api/policies/search are pure Node/retrieval
  # logic, so this catches wiring bugs (bad imports, broken routes, server
  # crash on startup) for free, on every single feature PR, without
  # touching the Groq token budget at all. The full LLM-dependent E2E
  # suite now runs later, at develop → qa, not here.
  boot-smoke:
    name: Boot Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: schema-validation




    steps:
      - uses: actions/checkout@v4




      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'




      - run: npm ci




      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready! ✅" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done




      - name: Verify /api/health responds correctly
        run: |
          curl -sf http://localhost:3000/api/health -o /tmp/health_response.json
          cat /tmp/health_response.json
          node -e "
          const data = JSON.parse(require('fs').readFileSync('/tmp/health_response.json', 'utf8'));
          if (data.status !== 'ok') { console.error('Health check did not return ok'); process.exit(1); }
          console.log('Health check OK ✅');
          "




      - name: Verify /api/policies/search responds correctly (no Groq call)
        run: |
          curl -sf "http://localhost:3000/api/policies/search?q=emirates+id" -o /tmp/search_response.json
          node -e "
          const data = JSON.parse(require('fs').readFileSync('/tmp/search_response.json', 'utf8'));
          if (!Array.isArray(data.results)) { console.error('Search did not return a results array'); process.exit(1); }
          if (data.results.length === 0) { console.error('Search returned zero results for a known-good query'); process.exit(1); }
          console.log('Policy search OK ✅ (' + data.results.length + ' results)');
          "


      - name: Verify auth endpoints fail open (no Supabase secrets in this job, by design)
        # AUDIT NOTE: this job deliberately has zero Supabase config — same
        # "zero external credentials" philosophy already applied to Groq
        # here. This confirms the server boots and the auth routes degrade
        # gracefully (503, not a crash) rather than assuming it — this is
        # the exact scenario that broke Boot Smoke once already this
        # project (server.js crashing at startup when Supabase env vars
        # were missing, before that was fixed).
        run: |
          STATUS=$(curl -s -o /tmp/auth_response.json -w "%{http_code}" -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Boot Smoke Test","email":"bootsmoke@test.invalid","password":"irrelevant"}')
          cat /tmp/auth_response.json
          node -e "
          const data = JSON.parse(require('fs').readFileSync('/tmp/auth_response.json', 'utf8'));
          if ('$STATUS' !== '503') { console.error('Expected 503 (Supabase unconfigured), got $STATUS'); process.exit(1); }
          if (data.success !== false) { console.error('Expected success: false in the fail-open response'); process.exit(1); }
          console.log('Auth fail-open behavior confirmed ✅ (503, graceful, no crash)');
          "




