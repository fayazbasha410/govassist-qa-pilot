name: Nightly Quality Gate

on:
  workflow_dispatch: # manual trigger only

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  # ── Full RAG eval ─────────────────────────────────────
  nightly-full-eval:
    name: Full RAG Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm install -g promptfoo

      - name: Start server
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && break
            sleep 3
          done

      - name: Run full eval
        run: npm run eval

      - name: Run regression gate
        run: npm run eval:regression

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-eval-${{ github.run_number }}
          path: /tmp/govmurshid-eval.json
          retention-days: 30

  # ── Red team ──────────────────────────────────────────
  nightly-red-team:
    name: Nightly Red Team
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Start server
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && break
            sleep 3
          done

      - name: Run red team
        run: npm run eval:redteam

  # ── Accessibility ─────────────────────────────────────
  nightly-accessibility:
    name: Nightly Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && break
            sleep 3
          done

      - name: Run accessibility tests
        run: npx playwright test tests/specs/ui/accessibility.spec.js

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-a11y-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30