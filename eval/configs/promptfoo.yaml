concurrency: 1
description: GovMurshid UAE Government Services RAG Eval — English + Arabic


providers:
  - id: http
    config:
      url: http://localhost:3000/api/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: "{{input}}"
      transformResponse: |
       (json) => json.reply


prompts:
  - "{{input}}"


tests:


  # ── IDENTITY ───────────────────────────────────────────
  - description: "GD-001 Emirates ID renewal fee and expiry penalty"
    vars:
      input: "What is the renewal fee and penalty for an expired Emirates ID?"
    assert:
      - type: llm-rubric
        value: "The response mentions a fee or penalty amount related to the Emirates ID, such as AED 100"
      - type: not-contains
        value: "no penalty"


  - description: "GD-002 Residency visa renewal documents"
    vars:
      input: "What documents do I need to renew my UAE residency visa?"
    assert:
      - type: llm-rubric
        value: "The response mentions at least two required documents such as passport, Emirates ID, or medical fitness certificate"
      - type: not-contains
        value: "I don't know"


  - description: "GD-003 Golden Visa eligibility"
    vars:
      input: "Who can apply for the UAE Golden Visa and how long is it valid?"
    assert:
      - type: llm-rubric
        value: "The response mentions at least one eligible category such as investors or entrepreneurs, and mentions the visa duration"
      - type: not-contains
        value: "I don't know"


  # ── HOUSING ────────────────────────────────────────────
  - description: "GD-004 Ejari registration Dubai"
    vars:
      input: "How do I register my rental contract in Dubai?"
    assert:
      - type: llm-rubric
        value: "The response mentions Ejari as the tenancy registration system in Dubai"
      - type: not-contains
        value: "I don't know"


  - description: "GD-005 Tawtheeq registration Abu Dhabi"
    vars:
      input: "How do I register my rental contract in Abu Dhabi?"
    assert:
      - type: llm-rubric
        value: "The response provides helpful information about registering a rental or tenancy contract in Abu Dhabi and mentions Tawtheeq or TAMM"
      - type: not-contains
        value: "I don't know"


  # ── HEALTHCARE ─────────────────────────────────────────
  - description: "GD-006 Health insurance mandatory Dubai"
    vars:
      input: "Is health insurance mandatory for residents in Dubai?"
    assert:
      - type: llm-rubric
        value: "The response clearly states that health insurance is mandatory in Dubai and mentions the employer's responsibility or DHA"
      - type: not-contains
        value: "optional"


  - description: "GD-007 Medical fitness certificate for residency visa"
    vars:
      input: "What medical tests are done for the UAE residency visa fitness certificate?"
    assert:
      - type: llm-rubric
        value: "The response mentions at least two tests such as blood test, chest X-ray, or physical examination"
      - type: not-contains
        value: "I don't know"


  # ── EDUCATION ──────────────────────────────────────────
  - description: "GD-008 School enrollment Dubai KHDA"
    vars:
      input: "What is the process for enrolling a child in a Dubai school?"
    assert:
      - type: llm-rubric
        value: "The response mentions KHDA as the Dubai school regulator and mentions required documents"
      - type: not-contains
        value: "I don't know"


  - description: "GD-009 Abu Dhabi school regulator"
    vars:
      input: "Which authority regulates private schools in Abu Dhabi?"
    assert:
      - type: llm-rubric
        value: "The response correctly identifies ADEK or Abu Dhabi Department of Education and Knowledge as the regulator"
      - type: not-contains
        value: "KHDA"


  # ── BUSINESS ───────────────────────────────────────────
  - description: "GD-010 Trade license renewal Dubai"
    vars:
      input: "What is the process and penalty for late trade license renewal in Dubai?"
    assert:
      - type: llm-rubric
        value: "The response mentions the renewal process and a late penalty, grace period, or fine"
      - type: not-contains
        value: "I don't know"


  - description: "GD-011 VAT registration threshold"
    vars:
      input: "When must a UAE business register for VAT and what is the threshold?"
    assert:
      - type: llm-rubric
        value: "The response mentions AED 375,000 as the mandatory VAT registration threshold or mentions the Federal Tax Authority"
      - type: not-contains
        value: "no VAT"


  # ── SOCIAL ─────────────────────────────────────────────
  - description: "GD-012 Expatriate end of service gratuity"
    vars:
      input: "How is end of service gratuity calculated for expatriate employees in UAE?"
    assert:
      - type: llm-rubric
        value: "The response explains gratuity calculation mentioning 21 days per year for first 5 years or 30 days thereafter"
      - type: not-contains
        value: "no benefits"


  # ── STEP 3 ADDITIONS (v3.10.0) ─────────────────────────
  - description: "GD-013 MOI lost Emirates ID replacement"
    vars:
      input: "I lost my Emirates ID, how do I get a replacement?"
    assert:
      - type: llm-rubric
        value: "The response explains how to report and replace a lost Emirates ID, mentioning ICP or a police report"
      - type: not-contains
        value: "I don't know"


  - description: "GD-014 MOHRE labour complaint for unpaid salary"
    vars:
      input: "How do I file a complaint for unpaid salary?"
    assert:
      - type: llm-rubric
        value: "The response mentions MOHRE, the hotline 80060, or the Wage Protection System"
      - type: not-contains
        value: "I don't know"


  - description: "GD-015 Zakat Fund eligibility"
    vars:
      input: "Who is eligible to receive Zakat Fund support?"
    assert:
      - type: llm-rubric
        value: "The response mentions the Zakat Fund and at least one eligibility category such as the poor, needy, or debtors"
      - type: not-contains
        value: "I don't know"


  - description: "GD-016 Widows financial support"
    vars:
      input: "What financial support is available for widows in the UAE?"
    assert:
      - type: llm-rubric
        value: "The response mentions social support available to widows, such as a stipend or the Ministry of Community Development"
      - type: not-contains
        value: "I don't know"


  - description: "GD-017 Telecom setup Etisalat du"
    vars:
      input: "How do I set up home internet with Etisalat or du?"
    assert:
      - type: llm-rubric
        value: "The response mentions Etisalat or du and required documents such as Emirates ID or a tenancy contract"
      - type: not-contains
        value: "I don't know"


  - description: "GD-018 Medical fitness for employment"
    vars:
      input: "Do I need a medical test for a new job in the UAE?"
    assert:
      - type: llm-rubric
        value: "The response mentions employment-related medical fitness requirements such as drug screening or occupational health"
      - type: not-contains
        value: "I don't know"


  - description: "GD-019 Death certificate registration"
    vars:
      input: "How do I register a death certificate in the UAE?"
    assert:
      - type: llm-rubric
        value: "The response mentions registering the death within a specific timeframe and attestation requirements"
      - type: not-contains
        value: "I don't know"


  - description: "GD-020 Company formation mainland vs free zone"
    vars:
      input: "Should I set up my company in a free zone or mainland?"
    assert:
      - type: llm-rubric
        value: "The response compares mainland and free zone company setup, mentioning foreign ownership or market access differences"
      - type: not-contains
        value: "I don't know"


  - description: "GD-021 Divorce certificate attestation"
    vars:
      input: "How do I get a divorce certificate attested in the UAE?"
    assert:
      - type: llm-rubric
        value: "The response mentions the Personal Status Courts or attestation process involving the Ministry of Foreign Affairs"
      - type: not-contains
        value: "I don't know"


  - description: "GD-022 TAMM platform Abu Dhabi"
    vars:
      input: "What can I do on the TAMM platform?"
    assert:
      - type: llm-rubric
        value: "The response describes TAMM as Abu Dhabi's digital government services platform and mentions UAE Pass or specific services"
      - type: not-contains
        value: "I don't know"


  - description: "GD-023 Dubai rent dispute RDSC"
    vars:
      input: "How do I dispute a rent increase in Dubai?"
    assert:
      - type: llm-rubric
        value: "The response mentions the Rental Dispute Settlement Centre or RERA's rental increase rules"
      - type: not-contains
        value: "I don't know"


  # ── ARABIC CASES ───────────────────────────────────────
  - description: "GD-024 Arabic — Emirates ID fine"
    vars:
      input: "ما هي غرامة انتهاء صلاحية الهوية الإماراتية؟"
    assert:
      - type: llm-rubric
        value: "The response is in Arabic and mentions a fine or penalty related to Emirates ID"
      - type: not-contains
        value: "I don't know"


  - description: "GD-025 Arabic — health insurance Dubai"
    vars:
      input: "هل التأمين الصحي إلزامي في دبي؟"
    assert:
      - type: llm-rubric
        value: "The response is in Arabic and confirms that health insurance is mandatory in Dubai"
      - type: not-contains
        value: "I don't know"


  - description: "GD-026 Arabic — Ejari registration"
    vars:
      input: "كيف أسجل عقد الإيجار في دبي؟"
    assert:
      - type: llm-rubric
        value: "The response is in Arabic and mentions Ejari or the tenancy registration process in Dubai"
      - type: not-contains
        value: "I don't know"


  - description: "GD-027 Arabic — Golden Visa"
    vars:
      input: "من يحق له التقدم للحصول على الإقامة الذهبية في الإمارات؟"
    assert:
      - type: llm-rubric
        value: "The response is in Arabic and mentions eligible categories for the Golden Visa such as investors or entrepreneurs"
      - type: not-contains
        value: "I don't know"


  - description: "GD-028 Arabic — Emirates ID replacement"
    vars:
      input: "فقدت هويتي الإماراتية، كيف أحصل على بدل فاقد؟"
    assert:
      - type: llm-rubric
        value: "The response is in Arabic and explains how to report and replace a lost Emirates ID"
      - type: not-contains
        value: "I don't know"


# Scoring — use Groq as judge (replaces Ollama)
defaultTest:
  options:
    provider:
      id: groq:llama-3.1-8b-instant
      config:
        apiKey: "{{env.GROQ_API_KEY}}"